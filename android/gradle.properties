org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Fix: Kotlin daemon cross-drive incremental cache corruption ───────────────
# The Kotlin incremental compiler fails when the Pub cache (C:\) and the
# project (D:\) are on different drive roots.  Disabling incremental Kotlin
# compilation removes the codepath that creates those broken .tab files.
kotlin.incremental=false
# Run Kotlin compilation in-process instead of spawning a daemon that holds
# stale cross-drive file handles.
kotlin.compiler.execution.strategy=in-process
